<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Forum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="theme-loader.js"></script>
    <link rel="stylesheet" href="themes.css">
    <style>
        main > h1.text-3xl {
            color: var(--text-primary);
        }
        nav .text-2xl.font-bold {
            color: var(--text-primary);
        }
        .setting-card .text-gray-600 {
            color: var(--text-secondary);
        }
        .setting-card .text-gray-700 {
            color: var(--text-primary);
        }
    </style>
</head>
<body class="min-h-screen">
    <nav class="shadow-md border-b">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <a href="/" class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-lg">F</span>
                    </div>
                    <h1 class="text-2xl font-bold">Forum</h1>
                </a>
                <div id="auth-section-settings">
                </div>
            </div>
        </div>
    </nav>

    <div id="user-profile-dropdown-settings" class="hidden fixed top-16 right-4 rounded-lg shadow-lg p-2 border z-50 w-60" style="border-color: var(--border-color);">
        <div class="flex items-center space-x-3 p-2 mb-2 border-b" style="border-bottom-color: var(--border-color);">
            <div id="modal-profile-img-container-settings">
            </div>
            <div>
                <div id="modal-user-name-settings" class="font-medium text-sm"></div>
                <div id="modal-user-email-settings" class="text-xs text-gray-500"></div>
            </div>
        </div>
        <nav class="space-y-1">
            <a href="#" id="profile-menu-profile-settings-page" class="profile-menu-item">
                <svg class="w-5 h-5 mr-2 inline" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Profile
            </a>
            <a href="settings.html" id="profile-menu-settings-settings-page" class="profile-menu-item">
                <svg class="w-5 h-5 mr-2 inline" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Settings
            </a>
            <hr class="my-1" style="border-top-color: var(--border-color);">
            <button id="logout-btn-settings-page" class="w-full text-left profile-menu-item">
                 <svg class="w-5 h-5 mr-2 inline" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Sign Out
            </button>
        </nav>
    </div>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Settings</h1>

        <section id="appearance-settings" class="setting-card shadow-md rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Appearance</h2>
            <p class="text-sm text-gray-600 mb-1">Choose your preferred theme.</p>
            <div class="space-y-3">
                <div>
                    <input type="radio" id="theme-light" name="theme" value="light" class="sr-only">
                    <label for="theme-light" class="flex items-center cursor-pointer p-3 border rounded-lg hover:bg-gray-50 transition-colors">
                        <span class="w-5 h-5 border-2 border-gray-300 rounded-full mr-3 flex items-center justify-center">
                            <span class="radio-dot w-2.5 h-2.5 bg-blue-500 rounded-full hidden"></span>
                        </span>
                        Light Mode
                    </label>
                </div>
                <div>
                    <input type="radio" id="theme-dark" name="theme" value="dark" class="sr-only">
                    <label for="theme-dark" class="flex items-center cursor-pointer p-3 border rounded-lg hover:bg-gray-50 transition-colors">
                         <span class="w-5 h-5 border-2 border-gray-300 rounded-full mr-3 flex items-center justify-center">
                            <span class="radio-dot w-2.5 h-2.5 bg-blue-500 rounded-full hidden"></span>
                        </span>
                        Dark Mode
                    </label>
                </div>
                <div>
                    <input type="radio" id="theme-midnight" name="theme" value="midnight" class="sr-only">
                    <label for="theme-midnight" class="flex items-center cursor-pointer p-3 border rounded-lg hover:bg-gray-50 transition-colors">
                         <span class="w-5 h-5 border-2 border-gray-300 rounded-full mr-3 flex items-center justify-center">
                            <span class="radio-dot w-2.5 h-2.5 bg-blue-500 rounded-full hidden"></span>
                        </span>
                        Midnight Mode
                    </label>
                </div>
            </div>
        </section>

        <section id="placeholder-settings" class="setting-card shadow-md rounded-lg p-6">
            <h2 class="text-xl font-semibold mb-4">Future Settings (Placeholders)</h2>
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <label for="notification-toggle" class="text-gray-700">Enable Email Notifications</label>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="notification-toggle" id="notification-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="notification-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer toggle-bg"></label>
                    </div>
                </div>
                <div class="flex justify-between items-center">
                    <label for="privacy-toggle" class="text-gray-700">Make Profile Private</label>
                     <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="privacy-toggle" id="privacy-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="privacy-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer toggle-bg"></label>
                    </div>
                </div>
                 <div class="flex justify-between items-center">
                    <label for="another-toggle" class="text-gray-700">Another Future Setting</label>
                     <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="another-toggle" id="another-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="another-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer toggle-bg"></label>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let currentLoggedInUserConfig = null;

        // Applies a new theme to the website and saves it.
        async function applyTheme(theme, fromEvent = false) {
            document.documentElement.className = 'theme-' + theme;
            
            localStorage.setItem('theme', theme);

            if (fromEvent) {
                try {
                    await fetch('/api/user/theme', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ theme }),
                    });
                } catch (error) {
                    console.error('Failed to save theme:', error);
                }
            }

            const radioButtons = document.querySelectorAll('input[name="theme"]');
            radioButtons.forEach(radio => {
                radio.checked = (radio.value === theme);
                const dot = radio.nextElementSibling.querySelector('.radio-dot');
                if (dot) {
                    dot.classList.toggle('hidden', radio.value !== theme);
                }
                radio.nextElementSibling.classList.toggle('border-blue-500', radio.value === theme);
                radio.nextElementSibling.classList.toggle('bg-blue-50', radio.value === theme);
            });
            updateToggleStyles(theme);
        }
        
        // Updates the styles of the toggle switches based on the current theme.
        function updateToggleStyles(theme) {
            const isDark = theme === 'dark' || theme === 'midnight';
            document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
                const label = checkbox.nextElementSibling;
                if (isDark) {
                    label.style.backgroundColor = checkbox.checked ? 'var(--button-bg)' : 'var(--input-bg)';
                    checkbox.style.borderColor = 'var(--input-border)';
                    checkbox.style.backgroundColor = 'var(--text-primary)';
                } else {
                    label.style.backgroundColor = checkbox.checked ? '#3B82F6' : '#CBD5E0';
                    checkbox.style.borderColor = '#a0aec0';
                    checkbox.style.backgroundColor = 'white';
                }
            });
        }

        // Loads and applies the saved theme.
        function loadTheme(theme) {
            applyTheme(theme);
            return theme;
        }

        // Gets the first letter of the first two words of a name.
        function getInitials(displayName) {
            if (!displayName) return '?';
            return displayName.split(' ').map(word => word[0]).join('').toUpperCase().slice(0, 2);
        }

        // Creates a user profile image or a fallback with initials.
        function createProfileImage(photoUrl, displayName, size = "w-10 h-10", textClass = "text-sm", borderClass = "") {
            const container = document.createElement('div');
            container.className = `profile-img ${size} ${borderClass} rounded-full flex items-center justify-center overflow-hidden`;
            container.style.backgroundColor = 'var(--input-field-bg)';
            
            if (borderClass && borderClass.includes('border')) { 
                container.style.borderColor = 'var(--border-color-medium)';
            }
            
            if (photoUrl && photoUrl.trim() && photoUrl !== '/default-profile.png') {
                const img = document.createElement('img');
                img.className = 'w-full h-full object-cover'; 
                img.alt = displayName || 'Profile';
                
                img.onerror = function() {
                    container.innerHTML = `<span class="profile-initials ${textClass} font-semibold" style="color: var(--text-secondary);">${getInitials(displayName)}</span>`;
                };
                img.src = photoUrl + '?t=' + Date.now();
                container.appendChild(img);
            } else {
                container.innerHTML = `<span class="profile-initials ${textClass} font-semibold" style="color: var(--text-secondary);">${getInitials(displayName)}</span>`;
            }
            return container;
        }

        // Checks if a user is logged in on the settings page.
        async function checkAuthStatusForSettingsPage() {
            try {
                const response = await fetch('/api/user', { credentials: 'include' });
                if (response.ok) {
                    currentLoggedInUserConfig = await response.json();
                } else {
                    currentLoggedInUserConfig = null;
                }
            } catch (error) {
                console.error('Auth check failed on settings page:', error);
                currentLoggedInUserConfig = null;
            }
            updateSettingsPageNav();
        }

        // Updates the navigation bar based on the user's login status.
        function updateSettingsPageNav() {
            const authSection = document.getElementById('auth-section-settings');
            const userProfileDropdown = document.getElementById('user-profile-dropdown-settings'); 

            if (currentLoggedInUserConfig) {
                const navProfileImg = createProfileImage(currentLoggedInUserConfig.photo, currentLoggedInUserConfig.displayName, "w-8 h-8", "text-xs");
                
                authSection.innerHTML = `
                    <button onclick="toggleSettingsDropdown()" class="nav-profile-button-hover flex items-center space-x-2 p-1 rounded-lg transition-colors">
                        <div id="nav-profile-img-container-settings-page"></div>
                        <span class="font-medium text-sm">${escapeHtml(currentLoggedInUserConfig.displayName)}</span>
                    </button>
                `;
                document.getElementById('nav-profile-img-container-settings-page').appendChild(navProfileImg);

                const modalImgContainer = document.getElementById('modal-profile-img-container-settings');
                modalImgContainer.innerHTML = ''; 
                modalImgContainer.appendChild(createProfileImage(currentLoggedInUserConfig.photo, currentLoggedInUserConfig.displayName, "w-10 h-10", "text-base", "border-2"));
                
                document.getElementById('modal-user-name-settings').textContent = currentLoggedInUserConfig.displayName;
                const userEmailElem = document.getElementById('modal-user-email-settings');
                userEmailElem.textContent = currentLoggedInUserConfig.email;
                userEmailElem.classList.add('truncate');
                
                const profileMenuLink = document.getElementById('profile-menu-profile-settings-page');
                if (profileMenuLink) {
                    profileMenuLink.href = `profile.html?id=${currentLoggedInUserConfig.id}`;
                }

                const logoutBtn = document.getElementById('logout-btn-settings-page');
                logoutBtn.removeEventListener('click', logoutFromSettingsPage); 
                logoutBtn.addEventListener('click', logoutFromSettingsPage);
                
            } else {
                authSection.innerHTML = '<a href="/" id="back-to-forum-link-settings" class="hover:underline">Back to Forum</a>';
                if(userProfileDropdown) userProfileDropdown.classList.add('hidden');
            }
        }
        
        // Shows or hides the settings dropdown menu.
        function toggleSettingsDropdown() {
            const userProfileDropdown = document.getElementById('user-profile-dropdown-settings');
            if (!currentLoggedInUserConfig || !userProfileDropdown) return;
            userProfileDropdown.classList.toggle('hidden');
        }

        // Logs the user out from the settings page.
        async function logoutFromSettingsPage() {
            try {
                await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
                currentLoggedInUserConfig = null;
                updateSettingsPageNav();
                window.location.href = '/'; 
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }
        
        // Escapes HTML to prevent XSS attacks.
        function escapeHtml(text) {
            if (text === null || typeof text === 'undefined') return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initializes the page when the DOM is fully loaded.
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthStatusForSettingsPage().then(() => {
                const currentTheme = currentLoggedInUserConfig ? currentLoggedInUserConfig.theme : 'dark';
                loadTheme(currentTheme);

                const themeRadios = document.querySelectorAll('input[name="theme"]');
                themeRadios.forEach(radio => {
                    radio.addEventListener('change', (event) => {
                        applyTheme(event.target.value, true);
                    });
                });
                document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', () => updateToggleStyles(currentLoggedInUserConfig ? currentLoggedInUserConfig.theme : 'dark'));
                });
                updateToggleStyles(currentTheme);

                document.querySelectorAll('.toggle-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', (event) => {
                        const label = event.target.nextElementSibling;
                        if (event.target.checked) {
                            label.style.backgroundColor = (currentLoggedInUserConfig && (currentLoggedInUserConfig.theme === 'dark' || currentLoggedInUserConfig.theme === 'midnight')) ? 'var(--button-bg)' : '#3B82F6';
                        } else {
                            label.style.backgroundColor = (currentLoggedInUserConfig && (currentLoggedInUserConfig.theme === 'dark' || currentLoggedInUserConfig.theme === 'midnight')) ? 'var(--input-bg)' : '#CBD5E0';
                        }
                    });
                });
            });
        });

        // Closes the dropdown menu when clicking outside of it.
        document.addEventListener('click', (e) => {
            const userProfileDropdown = document.getElementById('user-profile-dropdown-settings');
            const authSection = document.getElementById('auth-section-settings');
            if (authSection && userProfileDropdown && 
                !authSection.contains(e.target) && 
                !userProfileDropdown.contains(e.target)) {
                userProfileDropdown.classList.add('hidden');
            }
        });
        
        const style = document.createElement('style');
        style.textContent = `
            .toggle-checkbox:checked {
                right: 0;
                border-color: var(--button-bg);
            }
            .toggle-checkbox:checked + .toggle-label {
                background-color: var(--button-bg);
            }
            .radio-dot {
                display: none;
            }
            input[type="radio"]:checked + label .radio-dot {
                display: block;
            }
            input[type="radio"] + label {
                border-color: var(--input-border);
            }
             input[type="radio"]:checked + label {
                border-color: var(--link-color) !important;
                background-color: var(--bg-secondary) !important;
            }
            input[type="radio"] + label:hover {
                background-color: var(--bg-secondary);
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
</html>
